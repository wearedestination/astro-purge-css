name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Biome
        run: npm run check

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

  # Aggregate gate with a stable name for branch protection to require,
  # so jobs can be added or renamed without updating the required-check config.
  ci-success:
    name: CI Success
    if: always()
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any job failed
        if: needs.ci.result != 'success'
        run: |
          echo "ci result: ${{ needs.ci.result }}"
          exit 1
